name: Build Periodic v2.2 APK
on: { workflow_dispatch: {}, push: { branches: ["main","master"] } }
permissions: { contents: read }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - name: Validate project configuration
     run: |
       grep -q 'android.useAndroidX=true' gradle.properties
       grep -q 'VERSION_17' app/build.gradle
       grep -q '1.71.5' app/build.gradle
   - name: Validate element data
     run: gradle testDebugUnitTest --stacktrace
   - name: Validate routing keys
     run: |
       grep -q 'putExtra("atomicNumber"' app/src/main/java/com/periodic/app/MainActivity.kt
       grep -q 'getIntExtra("atomicNumber"' app/src/main/java/com/periodic/app/ElementDetailActivity.java
   - name: Build APK
     run: gradle clean assembleDebug --stacktrace
   - name: Verify and rename APK
     run: |
       test -s app/build/outputs/apk/debug/app-debug.apk
       cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Periodic-v2.2-debug.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Periodic-v2.2-debug-apk
      path: app/build/outputs/apk/debug/Periodic-v2.2-debug.apk
      if-no-files-found: error
      compression-level: 0
