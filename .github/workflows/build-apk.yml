name: Build Periodic Filament APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Periodic Filament APK
        run: gradle clean assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Periodic-v2-Filament-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Periodic-v2-Filament-debug-apk
          path: app/build/outputs/apk/debug/Periodic-v2-Filament-debug.apk
          if-no-files-found: error
          compression-level: 0
