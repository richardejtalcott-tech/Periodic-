plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.periodic.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.periodic.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1.0-filament'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'com.google.android.filament:filament-android:1.71.6'
    implementation 'com.google.android.filament:gltfio-android:1.71.6'
    implementation 'com.google.android.filament:filament-utils-android:1.71.6'
}
