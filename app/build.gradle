plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.periodic.app'; compileSdk 35
 defaultConfig { applicationId 'com.periodic.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '2.2.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}
dependencies {
 implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
 implementation 'com.google.android.filament:filament-android:1.71.5'
 implementation 'com.google.android.filament:gltfio-android:1.71.5'
 implementation 'com.google.android.filament:filament-utils-android:1.71.5'
 testImplementation 'junit:junit:4.13.2'
}
